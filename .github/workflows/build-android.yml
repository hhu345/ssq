name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    container: kivy/buildozer:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.gradle
          key: buildozer-v4-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v4-

      - name: Build APK with buildozer
        run: |
          cd $GITHUB_WORKSPACE
          export BUILDOZER_ALLOW_ROOT=1

          # ---- Pre-fetch freetype source and hand it to p4a via P4A_FREETYPE_DIR ----
          # savannah.gnu.org and its GNU mirrors (ftpmirror/ftp.gnu) return
          # 502/504 from CI runners, breaking the freetype recipe download
          # (freetype is required by sdl2_ttf/Kivy). p4a honours P4A_<NAME>_DIR:
          # it skips the download and symlinks the given source dir for building.
          FT_VER=2.14.1
          FT_DIR="$GITHUB_WORKSPACE/.p4a-deps"
          FT_TARBALL=/tmp/freetype-$FT_VER.tar.gz
          rm -rf "$FT_DIR"; mkdir -p "$FT_DIR"
          for U in \
            "https://downloads.sourceforge.net/project/freetype/freetype2/$FT_VER/freetype-$FT_VER.tar.gz" \
            "https://download.savannah.gnu.org/releases/freetype/freetype-$FT_VER.tar.gz" \
            "https://ftp.gnu.org/gnu/freetype/freetype-$FT_VER.tar.gz"; do
            echo "--- trying $U"
            rm -f "$FT_TARBALL"
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 900 -o "$FT_TARBALL" "$U" \
               && tar xzf "$FT_TARBALL" -C "$FT_DIR"; then
              echo "=== fetched freetype from $U"
              break
            fi
          done
          FT_SRC=""
          for d in "$FT_DIR"/*/; do
            if [ -f "${d}configure" ]; then FT_SRC="${d%/}"; break; fi
          done
          if [ -n "$FT_SRC" ]; then
            export P4A_FREETYPE_DIR="$FT_SRC"
            echo "=== P4A_FREETYPE_DIR=$P4A_FREETYPE_DIR ==="
          else
            echo "!!! freetype source unavailable from all mirrors; p4a will try its own URL"
          fi

          # Stage 1: let buildozer download its own SDK (will fail on missing platform, that's OK).
          yes | buildozer android debug 2>&1 | tee /tmp/stage1.log || true

          # ---- Fallback: if P4A_FREETYPE_DIR above did not take effect, point
          # p4a's own freetype URL at SourceForge (official freetype release
          # channel) instead of the unreachable savannah.gnu.org.
          P4A_SRC="$PWD/.buildozer/android/platform/python-for-android"
          if [ -d "$P4A_SRC" ]; then
            echo "=== Patching freetype recipe URL (savannah -> sourceforge) ==="
            find "$P4A_SRC/pythonforandroid/recipes/freetype" -type f -exec grep -l "savannah.gnu.org" {} \; 2>/dev/null | while read -r f; do
              sed -i -E 's#https?://(download-mirror\.|download\.)savannah\.gnu\.org/releases/freetype/freetype-[{]version[}]\.tar\.gz#https://downloads.sourceforge.net/project/freetype/freetype2/{version}/freetype-{version}.tar.gz#g' "$f"
            done
            # Drop any half-downloaded freetype so stage2 re-fetches cleanly.
            rm -rf "$PWD/.buildozer/android/platform/build-armeabi-v7a/packages/freetype" 2>/dev/null || true
            echo "--- patched recipe (verify) ---"
            grep -rn "sourceforge.net/project/freetype" "$P4A_SRC/pythonforandroid/recipes/freetype" 2>/dev/null || echo "  (no freetype recipe file matched)"
          else
            echo "!!! p4a source not found at $P4A_SRC (cannot patch freetype URL)"
          fi

          # Locate the SDK buildozer downloaded.
          SDK_DIR=""
          for d in "$PWD/.buildozer/android/platform/android-sdk" /github/home/.buildozer/android/platform/android-sdk; do
            if [ -f "$d/tools/bin/sdkmanager" ]; then SDK_DIR="$d"; break; fi
          done
          echo "=== SDK_DIR=$SDK_DIR ==="

          if [ -n "$SDK_DIR" ]; then
            SM="$SDK_DIR/tools/bin/sdkmanager"
            echo "--- Installing API 33 platform + build-tools + platform-tools ---"
            yes | "$SM" --sdk_root="$SDK_DIR" "platforms;android-33" "build-tools;33.0.0" "platform-tools" || true
            yes | "$SM" --sdk_root="$SDK_DIR" --licenses || true
            # Point buildozer at this SDK for the real build.
            export ANDROID_HOME="$SDK_DIR"
            export ANDROID_SDK_ROOT="$SDK_DIR"
            export ANDROIDSDK="$SDK_DIR"
            export ANDROIDAPI=33
            export ANDROIDNDKAPI=24
            export PATH="$PATH:$SDK_DIR/platform-tools:$SDK_DIR/build-tools/33.0.0"
          fi

          # Stage 2: final build.
          echo "=== Final build ==="
          yes | buildozer android debug

      - name: List output
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "No bin/ dir"
          echo "=== find apk ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ssq-apk
          path: bin/*.apk
          if-no-files-found: error
