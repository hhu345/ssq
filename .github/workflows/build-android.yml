name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    container: kivy/buildozer:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.gradle
          key: buildozer-v4-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v4-

      - name: Build APK with buildozer
        run: |
          # Ensure we're in the right directory (container may start elsewhere)
          cd $GITHUB_WORKSPACE
          
          # Set environment variables
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH=$PATH:/opt/android-sdk/tools:/opt/android-sdk/platform-tools:/opt/android-sdk/build-tools/33.0.0
          
          # Build debug APK
          buildozer android debug

      - name: List output
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "No bin/ dir"
          echo "=== find apk ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ssq-apk
          path: bin/*.apk
          if-no-files-found: error
