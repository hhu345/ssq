name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    container: kivy/buildozer:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.gradle
          key: buildozer-v4-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v4-

      - name: Build APK with buildozer
        run: |
          cd $GITHUB_WORKSPACE
          export BUILDOZER_ALLOW_ROOT=1

          # Stage 1: let buildozer download its own SDK (will fail on missing platform, that's OK).
          yes | buildozer android debug 2>&1 | tee /tmp/stage1.log || true

          # ---- Workaround: download.savannah.gnu.org is frequently 502/504 ----
          # from CI runners, which breaks the freetype recipe download and fails
          # the whole build. Patch python-for-android's freetype recipe to fetch
          # from a stable GNU mirror (ftpmirror.gnu.org) instead.
          P4A_SRC="$PWD/.buildozer/android/platform/python-for-android"
          if [ -d "$P4A_SRC" ]; then
            echo "=== Patching freetype recipe URL (savannah -> ftpmirror) ==="
            find "$P4A_SRC/pythonforandroid/recipes/freetype" -type f -exec grep -l "savannah.gnu.org" {} \; 2>/dev/null | while read -r f; do
              sed -i 's#https\?://download\.savannah\.gnu\.org/releases/freetype#https://ftpmirror.gnu.org/freetype#g' "$f"
            done
            # Drop any half-downloaded freetype so stage2 re-fetches from the mirror.
            rm -rf "$PWD/.buildozer/android/platform/build-armeabi-v7a/packages/freetype" 2>/dev/null || true
            echo "--- patched recipe (verify) ---"
            grep -rn "ftpmirror.gnu.org/freetype" "$P4A_SRC/pythonforandroid/recipes/freetype" 2>/dev/null || echo "  (no freetype recipe file matched)"
          else
            echo "!!! p4a source not found at $P4A_SRC (cannot patch freetype URL)"
          fi

          # Locate the SDK buildozer downloaded.
          SDK_DIR=""
          for d in "$PWD/.buildozer/android/platform/android-sdk" /github/home/.buildozer/android/platform/android-sdk; do
            if [ -f "$d/tools/bin/sdkmanager" ]; then SDK_DIR="$d"; break; fi
          done
          echo "=== SDK_DIR=$SDK_DIR ==="

          if [ -n "$SDK_DIR" ]; then
            SM="$SDK_DIR/tools/bin/sdkmanager"
            echo "--- Installing API 33 platform + build-tools + platform-tools ---"
            yes | "$SM" --sdk_root="$SDK_DIR" "platforms;android-33" "build-tools;33.0.0" "platform-tools" || true
            yes | "$SM" --sdk_root="$SDK_DIR" --licenses || true
            # Point buildozer at this SDK for the real build.
            export ANDROID_HOME="$SDK_DIR"
            export ANDROID_SDK_ROOT="$SDK_DIR"
            export ANDROIDSDK="$SDK_DIR"
            export ANDROIDAPI=33
            export ANDROIDNDKAPI=24
            export PATH="$PATH:$SDK_DIR/platform-tools:$SDK_DIR/build-tools/33.0.0"
          fi

          # Stage 2: final build.
          echo "=== Final build ==="
          yes | buildozer android debug

      - name: List output
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "No bin/ dir"
          echo "=== find apk ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ssq-apk
          path: bin/*.apk
          if-no-files-found: error
