name: Build Android APK

on:
  push:
    paths: ['main.py', 'buildozer.spec']
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3-pip python3-setuptools \
            autoconf automake gdb lld \
            libtool libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            pkg-config zlib1g-dev libjpeg-dev wget unzip zip \
            openjdk-17-jdk

          pip3 install --upgrade pip
          pip3 install cython==3.0.10 buildozer==1.5.0

      - name: Cache buildozer build
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build APK with Buildozer
        run: |
          # Set up environment
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export PATH=$ANDROID_HOME/tools:$ANDROID_HOME/platform-tools:$PATH
          
          # Pre-accept Android SDK licenses by creating license files
          mkdir -p $HOME/.android/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.android/licenses/android-sdk-preview-license
          
          # Install required SDK components
          sdkmanager "platform-tools" "build-tools;33.0.0" "platforms;android-33" || true
          
          # Run buildozer
          buildozer android debug 2>&1 | tail -150

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ssq-apk
          path: bin/*.apk
          if-no-files-found: error
