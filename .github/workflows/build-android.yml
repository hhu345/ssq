name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-pip python3-setuptools \
            autoconf automake gdb lld \
            libtool libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            pkg-config zlib1g-dev libjpeg-dev wget unzip zip openjdk-17-jdk

          pip3 install --upgrade pip
          pip3 install cython==3.0.10 buildozer==1.5.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/bin/sdkmanager \
            "platform-tools" \
            "build-tools;31.0.0" \
            "platforms;android-31" \
            "ndk;25.1.8937393" 2>&1 | tail -5

      - name: Cache buildozer build
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-apk-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-apk-

      - name: Build APK
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export ANDROID_HOME=$ANDROID_HOME
          yes | buildozer android debug 2>&1 | tail -300
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ssq-apk
          path: bin/*.apk
          if-no-files-found: warn
